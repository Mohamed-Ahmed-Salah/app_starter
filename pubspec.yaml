name: app_starter
description: "Flutter app starter — clean architecture, cubits, get_it, fpdart, dio."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fpdart: ^1.2.0
  dio: ^5.9.2
  equatable: ^2.0.7
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.2

  # Firebase
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_remote_config: ^6.5.3
  firebase_analytics: ^12.4.3
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^22.3.0

  # UI / platform
  flutter_screenutil: ^5.9.3
  toastification: ^3.2.0
  in_app_review: ^2.0.11
  url_launcher: ^6.3.2
  permission_handler: ^13.0.2
  pretty_dio_logger: ^1.4.0
  injectable: ^3.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  freezed: ^4.0.1
  flutter_flavorizr: ^2.5.0
  injectable_generator: ^3.1.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/imgs/
    - assets/logo/

  fonts:
    # One-glyph icon font kept as the pattern for a project icon set.
    # Regenerate from your own SVGs (IcoMoon) and extend core/res/app_icons.dart.
    - family: AppIcons
      fonts:
        - asset: assets/fonts/app_icons.ttf

# Native flavor generation (Android product flavors, iOS schemes + xcconfigs,
# launcher icons). Fill in every CHANGE_ME below, then run:
#
#   dart run flutter_flavorizr
#
# It rewrites android/ and ios/ project files, so run it once per change to
# this block, before hand-editing anything native. Flavor names here must
# match `enum Flavor` in lib/flavors.dart; the app reads them via `appFlavor`.
flavorizr:
  ide: "idea"
  app:
    android:
      flavorDimensions: "flavor-type"

  flavors:
    dev:
      app:
        name: "CHANGE_ME Dev"          # launcher label
      android:
        applicationId: "com.changeme.app.dev"   # CHANGE_ME
        icon: "assets/logo/app_icon_dev.png"     # CHANGE_ME: 1024x1024 png
      ios:
        bundleId: "com.changeme.app.dev"        # CHANGE_ME
        icon: "assets/logo/app_icon_dev.png"     # CHANGE_ME: 1024x1024 png
    prod:
      app:
        name: "CHANGE_ME"              # launcher label
      android:
        applicationId: "com.changeme.app"       # CHANGE_ME
        icon: "assets/logo/app_icon_prod.png"    # CHANGE_ME: 1024x1024 png
      ios:
        bundleId: "com.changeme.app"            # CHANGE_ME
        icon: "assets/logo/app_icon_prod.png"    # CHANGE_ME: 1024x1024 png
